name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (lint, test, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-junit
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npx vite build

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (typecheck, lint, test, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npx jest --ci

      - name: Bundle smoke (expo export, iOS + Android)
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"

      - name: expo-doctor
        # No per-SDK dist-tag exists after sdk-56; pin the release verified
        # against Expo SDK 58 (20/20 locally on 2026-10-26).
        run: npx --yes expo-doctor@1.21.5

  db:
    name: DB (migrations, pgTAP, behavior scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # packages: read lets the job's GITHUB_TOKEN pull from ghcr.io.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      # supabase start pulls from public.ecr.aws by default, and anonymous
      # pulls from shared runners hit "toomanyrequests: Data limit exceeded"
      # (2026-10-26). The start step switches the CLI to ghcr.io, pulled
      # with the job token.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start Supabase (db + auth only; applies every migration)
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        # kong and rest must run: supabase start's final health check calls
        # http://127.0.0.1:54321/rest-admin/v1/ready through kong, and fails
        # (after applying every migration) when either is excluded.
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector

      - name: pgTAP (supabase/tests/database)
        run: supabase test db supabase/tests/database

      - name: Behavior scripts (plain psql, BEGIN ... ROLLBACK)
        run: |
          shopt -s nullglob
          files=(supabase/tests/*.sql supabase/behavior-tests/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No behavior scripts yet."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker exec -i supabase_db_griptrack \
              psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < "$f"
            echo "::endgroup::"
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x

      - name: deno check every function
        # The repo root has a package.json, so Deno 2 would switch to
        # node_modules resolution and fail on every npm: import. The
        # functions are standalone Deno code: ignore package.json.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          fail=0
          for dir in supabase/functions/*/; do
            [ -f "${dir}index.ts" ] || continue
            echo "::group::deno check ${dir}index.ts"
            (cd "$dir" && deno check --no-lock index.ts) || fail=1
            echo "::endgroup::"
          done
          exit $fail
