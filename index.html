<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GripTrack — Film production inventory management for grip and electric departments." />
    <title>GripTrack</title>
    <!-- Apply the theme before React mounts (no flash). Same rules as
         src/hooks/useTheme.js: gt_theme_mode = system | light | dark; an old
         gt_theme="light" counts as light; anything else means System. -->
    <script>
      (function () {
        var mode = "system";
        try {
          var m = localStorage.getItem("gt_theme_mode");
          if (m === "system" || m === "light" || m === "dark") mode = m;
          else if (localStorage.getItem("gt_theme") === "light") mode = "light";
        } catch (e) {}
        var light = mode === "light";
        if (mode === "system") {
          try { light = window.matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
        }
        if (light) document.documentElement.classList.add("light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
